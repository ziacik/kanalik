name: GNOME Desktop CI

on:
  push:
    paths:
      - "desktop/**"
      - "install-desktop.sh"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "install-desktop.sh"
      - ".github/workflows/desktop-ci.yml"

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libmpv-dev pkg-config shellcheck desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - name: Check installer and GNOME launcher
        run: |
          bash -n ../install-desktop.sh
          shellcheck -S warning ../install-desktop.sh
          test_root="$(mktemp -d)"
          trap 'rm -rf -- "$test_root"' EXIT
          mkdir -p "$test_root/user home"
          printf '#!/bin/sh\nexit 0\n' > "$test_root/sample-bin"
          chmod +x "$test_root/sample-bin"
          export HOME="$test_root/user home"
          export XDG_DATA_HOME="$HOME/share"
          bash ../install-desktop.sh --binary "$test_root/sample-bin"
          test -x "$HOME/.local/bin/kanalik-gnome"
          desktop-file-validate "$XDG_DATA_HOME/applications/com.github.ziacik.Kanalik.desktop"
          grep -Fq 'Exec="' "$XDG_DATA_HOME/applications/com.github.ziacik.Kanalik.desktop"
          bash ../install-desktop.sh --uninstall
          test ! -e "$HOME/.local/bin/kanalik-gnome"
          test ! -e "$XDG_DATA_HOME/applications/com.github.ziacik.Kanalik.desktop"
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Test
        run: cargo test
      - name: Clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings
