<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17121f">
  <title>Kanálik</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top, #3d2852 0, #17121f 48%, #0d0a11 100%);
      color: #fff;
    }
    main { width: min(680px, 90vw); text-align: center; padding: 48px 24px; }
    h1 { margin: 0 0 10px; font-size: clamp(3rem, 10vw, 6rem); letter-spacing: -.05em; }
    p { color: #cfc7d8; font-size: clamp(1rem, 3vw, 1.35rem); margin: 0 0 36px; }
    a.button {
      display: inline-block;
      min-width: min(100%, 360px);
      padding: 20px 28px;
      border-radius: 18px;
      background: #f0c419;
      color: #1a1420;
      text-decoration: none;
      font-size: 1.35rem;
      font-weight: 800;
      box-shadow: 0 12px 40px rgba(0,0,0,.35);
    }
    a.button:focus, a.button:hover { outline: 4px solid #fff; outline-offset: 5px; }
    #status { margin-top: 22px; min-height: 1.5em; color: #9d93a8; font-size: .95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Kanálik</h1>
    <p>Android TV prehrávač</p>
    <a id="download" class="button" href="./kanalik.apk">Stiahnuť APK</a>
    <div id="status">Priame stiahnutie APK</div>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      try {
        const response = await fetch('https://api.github.com/repos/ziacik/kanalik/releases/latest', {
          headers: { 'Accept': 'application/vnd.github+json' }
        });
        if (!response.ok) return;
        const release = await response.json();
        status.textContent = release.name || release.tag_name || 'Priame stiahnutie APK';
      } catch (_) {}
    })();
  </script>
</body>
</html>
